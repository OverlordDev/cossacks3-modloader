<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Экран игры</title>
<link rel="stylesheet" href="common.css">
<!--
  Зеркало родного интерфейса. Игра строит свой экран как обычно (он остаётся под страницей),
  а здесь он рисуется заново в стиле мода: те же элементы на тех же местах.

  Данные — game.api('mirror.snapshot') (api/16_mirror.lua). Нажатия уходят обратно в игру
  (mirror.click / select / input), и дальше работает родная логика экрана: ничего из неё здесь
  не повторяется. Игра после нажатия перестраивает экран — мод зовёт mirror.refresh().

  Свой вид для конкретного экрана — отдельная страница и screens.replace в client.lua.
-->
<style>
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

  .el { position: absolute; display: flex; align-items: center; overflow: hidden; }

  .panel {
    background: rgba(18, 15, 11, .78);
    border: 1px solid rgba(107, 86, 54, .75);
    border-radius: 6px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .45);
  }

  .text {
    color: var(--gold);
    font-size: 15px;
    line-height: 1.2;
    text-shadow: 0 1px 3px #000;
    white-space: pre-line;
    pointer-events: none;
  }

  .button {
    justify-content: center;
    padding: 0 10px;
    font: inherit;
    font-size: 15px;
    color: var(--gold);
    text-shadow: 0 1px 3px #000;
    background: linear-gradient(#5a4526, #3a2b16);
    border: 1px solid var(--edge);
    border-radius: 5px;
    cursor: pointer;
  }
  .button.with-text { background: url("button.png") center / 100% 100% no-repeat; border: 0; }
  .button.icon { background: rgba(0, 0, 0, .25); border-color: rgba(107, 86, 54, .5); }
  .button:hover { filter: brightness(1.3); color: var(--gold-bright); }
  .button:active { filter: brightness(.85); }
  .button.disabled { filter: grayscale(.7) brightness(.6); cursor: default; }

  .checkbox {
    width: 22px !important; height: 22px !important;
    justify-content: center;
    background: rgba(0, 0, 0, .45);
    border: 1px solid var(--edge);
    border-radius: 4px;
    cursor: pointer;
  }
  .checkbox.on::after { content: "✓"; color: var(--gold-bright); font-size: 16px; }

  select, input {
    width: 100%; height: 100%;
    font: inherit; font-size: 14px;
    color: var(--gold);
    background: rgba(0, 0, 0, .55);
    border: 1px solid var(--edge);
    border-radius: 4px;
    padding: 0 6px;
  }
  select option { background: #1b1510; }

  .list {
    align-items: stretch; flex-direction: column;
    overflow-y: auto;
    background: rgba(0, 0, 0, .45);
    border: 1px solid var(--edge);
    border-radius: 4px;
  }
  .list .row { padding: 5px 8px; font-size: 14px; cursor: pointer; border-bottom: 1px solid rgba(107, 86, 54, .25); }
  .list .row:hover { background: rgba(106, 86, 55, .3); }
  .list .row.selected { background: rgba(106, 86, 55, .6); }

  .clip { position: absolute; overflow-x: hidden; overflow-y: auto; }

  #error { position: fixed; bottom: 12px; left: 12px; color: #f99; font-size: 13px; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div id="stage"></div>
  <div id="error"></div>

<script src="bridge.js"></script>
<script>
  const stage = document.getElementById('stage');
  const errorBox = document.getElementById('error');
  let lastJson = '';
  let busy = false;

  // Крупные картинки родного экрана — окна и подложки: рисуем их панелями, мелкие (узоры,
  // рамки, иконки) пропускаем — на странице свой фон.
  const PANEL_MIN = { w: 160, h: 90 };

  function act(name, ...args) {
    game.api(name, ...args)
      .catch(e => { errorBox.textContent = e.message; })
      .finally(() => setTimeout(refresh, 60));
  }

  // Текст игры с разметкой: %color(RRGGBB)% меняет цвет до следующей такой метки,
  // прочие %метки% убираем.
  function richText(node, text) {
    const parts = String(text).split(/%color\(([0-9a-fA-F]{6})\)%/);
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) continue;
      const piece = parts[i].replace(/%[a-z]+(\([^)]*\))?%/gi, '');
      if (!piece) continue;
      const span = document.createElement('span');
      span.textContent = piece;
      if (i > 0) span.style.color = '#' + parts[i - 1];
      node.appendChild(span);
    }
  }

  // Размер шрифта — из имени шрифта игры (serif_12, serif_15 ...), чтобы строки ложились как в игре.
  function fontPx(font) {
    const m = /(\d+)/.exec(font || '');
    return m ? Math.max(11, Number(m[1]) + 1) : 15;
  }

  // Координаты элемента — экранные, но внутри прокручиваемой области — от её угла.
  let origin = { x: 0, y: 0 };

  function el(item, cls) {
    const d = document.createElement('div');
    d.className = 'el ' + cls;
    d.style.left = (item.x - origin.x) + 'px';
    d.style.top = (item.y - origin.y) + 'px';
    d.style.width = item.w + 'px';
    d.style.height = item.h + 'px';
    if (item.hint) d.title = item.hint;
    return d;
  }

  const render = {
    image(item) {
      if (item.w < PANEL_MIN.w || item.h < PANEL_MIN.h) return null;
      return el(item, 'panel');
    },

    text(item) {
      const d = el(item, 'text');
      d.style.fontSize = fontPx(item.font) + 'px';
      richText(d, item.text);
      return d;
    },

    button(item) {
      const d = el(item, 'button' + (item.text ? ' with-text' : ' icon') + (item.enabled ? '' : ' disabled'));
      richText(d, item.text || '');
      if (item.enabled) d.addEventListener('click', () => act('mirror.click', item.id));
      return d;
    },

    checkbox(item) {
      const d = el(item, 'checkbox' + (item.checked ? ' on' : ''));
      d.addEventListener('click', () => act('mirror.click', item.id));
      return d;
    },

    combo(item) {
      const d = el(item, '');
      const s = document.createElement('select');
      item.items.forEach((text, i) => s.add(new Option(
        String(text).replace(/%[a-z]+(\([^)]*\))?%/gi, ''), i, false, i === item.selected)));
      s.disabled = !item.enabled;
      s.addEventListener('change', () => act('mirror.select', item.id, Number(s.value)));
      d.appendChild(s);
      return d;
    },

    list(item) {
      const d = el(item, 'list');
      item.items.forEach((text, i) => {
        const r = document.createElement('div');
        r.className = 'row' + (i === item.selected ? ' selected' : '');
        richText(r, text);
        r.addEventListener('click', () => act('mirror.select', item.id, i));
        d.appendChild(r);
      });
      return d;
    },

    input(item) {
      const d = el(item, '');
      const i = document.createElement('input');
      i.value = item.text;
      i.dataset.id = item.id;
      i.addEventListener('change', () => act('mirror.input', item.id, i.value));
      d.appendChild(i);
      return d;
    },
  };

  function draw(snap) {
    // Поле, в котором сейчас печатают, не трогаем — иначе перерисовка съест ввод.
    const focused = document.activeElement && document.activeElement.dataset.id;
    const scale = window.innerWidth / snap.width;
    stage.style.width = snap.width + 'px';
    stage.style.height = snap.height + 'px';
    stage.style.transform = `scale(${scale})`;

    // Прокручиваемые области: свой блок на каждую, прокрутку сохраняем между перерисовками.
    const clips = Array.isArray(snap.clips) ? snap.clips : Object.values(snap.clips || {});
    const clipBox = {};
    const scrolls = {};
    stage.querySelectorAll('.clip').forEach(c => { scrolls[c.dataset.id] = c.scrollTop; });

    const frag = document.createDocumentFragment();
    let keep = null;
    for (const item of snap.items) {
      if (focused && item.kind === 'input' && String(item.id) === focused) {
        keep = document.activeElement.parentElement;
        continue;
      }
      let parent = frag;
      origin = { x: 0, y: 0 };
      if (item.clip) {
        const c = clips.find(c => c.id === item.clip);
        if (c) {
          if (!clipBox[c.id]) {
            const box = document.createElement('div');
            box.className = 'clip';
            box.dataset.id = c.id;
            Object.assign(box.style, { left: c.x + 'px', top: c.y + 'px', width: c.w + 'px', height: c.h + 'px' });
            clipBox[c.id] = box;
            frag.appendChild(box);
          }
          parent = clipBox[c.id];
          origin = { x: c.x, y: c.y };
        }
      }
      const node = (render[item.kind] || (() => null))(item);
      if (node) parent.appendChild(node);
    }
    origin = { x: 0, y: 0 };
    stage.replaceChildren(frag);
    if (keep) stage.appendChild(keep);
    stage.querySelectorAll('.clip').forEach(c => { c.scrollTop = scrolls[c.dataset.id] || 0; });
  }

  async function refresh() {
    if (busy) return;
    busy = true;
    try {
      const snap = await game.api('mirror.snapshot');
      // Пустая таблица Lua приходит объектом {}, а не массивом.
      if (!Array.isArray(snap.items)) snap.items = Object.values(snap.items || {});
      const json = JSON.stringify(snap);
      if (json !== lastJson) {
        lastJson = json;
        draw(snap);
      }
      errorBox.textContent = snap.items.length ? '' :
        `на экране игры ничего не найдено (${JSON.stringify(snap.stats)})`;
    } catch (e) {
      errorBox.textContent = e.message;
    } finally {
      busy = false;
    }
  }

  // Мод зовёт это, когда игра перестроила экран (client.lua).
  window.mirror = { refresh };

  bridge.whenReady(ok => {
    if (!ok) { errorBox.textContent = 'мост в игру не поднялся'; return; }
    refresh();
    // Часть экранов меняется сама (списки комнат, таймеры) — подтягиваем раз в секунду.
    setInterval(refresh, 1000);
  });
</script>
</body>
</html>
