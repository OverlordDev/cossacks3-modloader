<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Minimap Test</title>
<style>
  /* Страница во весь экран и прозрачная: где ничего не нарисовано, мышь идёт в игру (web.passthrough). */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 12px system-ui, sans-serif; }
  #mm {
    position: fixed; right: 16px; top: 64px; width: 256px; height: 256px;
    border: 3px solid #b8914a; border-radius: 6px; background: #1a1a1a;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .6); overflow: hidden; cursor: crosshair;
  }
  #mm canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #info {
    position: fixed; right: 16px; top: 330px; width: 262px; color: #f0e2c0; text-shadow: 0 1px 2px #000;
    background: rgba(0, 0, 0, .55); padding: 4px 6px; box-sizing: border-box; border-radius: 4px;
  }
</style>
</head>
<body>
<div id="mm"><canvas id="bg" width="256" height="256"></canvas><canvas id="fg" width="256" height="256"></canvas></div>
<div id="info">ждём данные карты…</div>
<script>
  // Данные шлёт client.lua мода: mm.map(...) — один раз, mm.units(...) — несколько раз в секунду.
  const S = 256;
  const bg = document.getElementById('bg').getContext('2d');
  const fg = document.getElementById('fg').getContext('2d');
  const info = document.getElementById('info');
  let W = 1, H = 1, colors = [], updates = 0, last = performance.now(), ups = 0;

  // Мир -> пиксель миникарты: x слева направо, z сверху вниз (как у миникарты игры).
  const px = x => (x + W / 2) / W * S;
  const py = z => (z + H / 2) / H * S;

  window.mm = {
    map(w, h, n, heights, cols, forest) {
      W = w; H = h; colors = cols;
      let lo = Infinity, hi = -Infinity;
      for (const v of heights) { if (v < lo) lo = v; if (v > hi) hi = v; }
      const img = bg.createImageData(n, n);
      for (let i = 0; i < n * n; i++) {
        const t = hi > lo ? (heights[i] - lo) / (hi - lo) : 0.5;      // высота 0..1: выше — светлее
        const f = Math.min(1, (forest[i] || 0) / 6);                   // леса и камни — темнее
        const k = (0.85 + t * 0.3) * (1 - f * 0.55);
        img.data.set([78 * k, 92 * k, 46 * k, 255], i * 4);
      }
      // растягиваем сетку на 256x256 через временный canvas (со сглаживанием)
      const tmp = document.createElement('canvas'); tmp.width = n; tmp.height = n;
      tmp.getContext('2d').putImageData(img, 0, 0);
      bg.imageSmoothingEnabled = true;
      bg.drawImage(tmp, 0, 0, S, S);
      info.textContent = `карта ${w}×${h}`;
    },

    units(list, cx, cz) {
      fg.clearRect(0, 0, S, S);
      let count = 0;
      if (list) for (const item of list.split(';')) {
        const [pl, x, z, built] = item.split(',').map(Number);
        fg.fillStyle = colors[pl] || '#fff';
        if (built) fg.fillRect(px(x) - 2, py(z) - 2, 4, 4); // здания крупнее
        else fg.fillRect(px(x) - 1, py(z) - 1, 2, 2);
        count++;
      }
      if (cx !== null && cz !== null) {                     // куда смотрит камера
        fg.strokeStyle = '#fff'; fg.lineWidth = 1;
        fg.strokeRect(px(cx) - 14, py(cz) - 10, 28, 20);
      }
      updates++;
      const now = performance.now();
      if (now - last >= 1000) { ups = updates * 1000 / (now - last); updates = 0; last = now; }
      info.textContent = `объектов: ${count} · обновлений/с: ${ups.toFixed(1)} · клик — камера · Ctrl+M — родная`;
    },
  };

  // Клик по миникарте — камера едет в эту точку.
  document.getElementById('mm').addEventListener('mousedown', e => {
    const r = e.currentTarget.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * W - W / 2;
    const z = (e.clientY - r.top) / r.height * H - H / 2;
    if (window.game) game.lua(`native.SetMainCameraMoveToTargetXZ(${x.toFixed(1)}, ${z.toFixed(1)}); native.SetMainCameraMoveToTarget(true)`);
  });
</script>
</body>
</html>
